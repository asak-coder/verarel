databases:
  - name: aken-postgres
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16
    ipAllowList: []

services:
  - type: redis
    name: aken-redis
    plan: starter
    region: oregon
    ipAllowList: []

  - type: web
    name: aken-api
    env: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt

    startCommand: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w 2
      --threads 2
      --timeout 60
      --keep-alive 5

    autoDeploy: true
    healthCheckPath: /healthz

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aken-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: aken-redis
          type: redis
          property: connectionString

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: SERVICE_NAME
        value: aken-api

      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: PYTHONUNBUFFERED
        value: "1"